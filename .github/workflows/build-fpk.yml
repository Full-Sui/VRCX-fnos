name: Build VRCX fnOS FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FPK version (leave empty to use upstream release version)"
        required: false
        default: ""
      upstream_ref:
        description: "Upstream VRCX tag (leave empty for latest release)"
        required: false
        default: ""
  schedule:
    # Check upstream VRCX once a day (02:00 UTC / 10:00 China time)
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: vrcx-fnos-build
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Resolve upstream VRCX release
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            let tag = '${{ inputs.upstream_ref }}'.trim();
            if (!tag) {
              const release = await github.rest.repos.getLatestRelease({
                owner: 'vrcx-team',
                repo: 'VRCX'
              });
              tag = release.data.tag_name;
            }
            let version = '${{ inputs.version }}'.trim();
            if (!version) {
              version = tag.replace(/^v/i, '').replace(/-.*$/, '');
              const parts = version.split('.');
              if (parts.length >= 3 && parts.every((p) => /^\d+$/.test(p))) {
                version = parts.map((p, i) => (i === 0 ? p : String(Number(p)))).join('.');
              }
            }
            if (!tag || !version) {
              core.setFailed('Could not resolve upstream tag or version');
              return;
            }
            core.setOutput('tag', tag);
            core.setOutput('version', version);

      - name: Skip if this release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout upstream VRCX source
        uses: actions/checkout@v4
        with:
          repository: vrcx-team/VRCX
          ref: ${{ needs.resolve.outputs.tag }}
          path: upstream-src
          fetch-depth: 1

      - name: Replace source with upstream and apply fnOS overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vrcx-src
          mv upstream-src vrcx-src
          rm -rf vrcx-src/.git
          cp -a overlay/. vrcx-src/
          test -f vrcx-src/WebHost/Program.cs
          test -f vrcx-src/src/web/webBridge.js

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install VRCX frontend dependencies
        working-directory: vrcx-src
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build VRCX frontend
        working-directory: vrcx-src
        run: npx vite build src

      - name: Publish VRCX backend
        working-directory: vrcx-src/WebHost
        run: >
          dotnet publish -c Release -r linux-x64 --self-contained true
          -p:Platform=x64 -p:WarningLevel=0
          -o "$GITHUB_WORKSPACE/app/bin"

      - name: Install gateway dependencies
        working-directory: app/server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assemble application tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/webui
          cp -a vrcx-src/build/html app/webui
          rm -rf app/ui
          cp -a fpk/ui app/ui
          rm -f app/app.sock
          rm -rf app/VRCX
          rm -f app/bin/node

      - name: Build FPK
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash build-fpk.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrcx-fnos-${{ needs.resolve.outputs.version }}
          path: vrcx_${{ needs.resolve.outputs.version }}_x86.fpk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: VRCX fnOS ${{ needs.resolve.outputs.version }}
          body: |
            VRCX 飞牛 NAS 网页版 ${{ needs.resolve.outputs.version }}

            上游 VRCX：`${{ needs.resolve.outputs.tag }}`
            安装包：`vrcx_${{ needs.resolve.outputs.version }}_x86.fpk`
            依赖：`nodejs_v24`
          files: vrcx_${{ needs.resolve.outputs.version }}_x86.fpk
          generate_release_notes: true
